<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>isaihook</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-black: #000000;
      --glass-base: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-highlight: rgba(255, 255, 255, 0.4);
      --text-white: #ffffff;
      --text-silver: #d4d4d8;
      --text-muted: #71717a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-black);
      color: var(--text-white);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      padding: 40px 16px 60px;
      perspective: 1200px;
    }

    /* Volumetric Cloud Motion Gradient Background */
    .cloud-stage {
      position: fixed;
      inset: -40%;
      width: 180%;
      height: 180%;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
      filter: blur(70px) contrast(140%);
      transition: transform 0.1s ease-out;
    }

    .cloud {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.04) 40%, rgba(0, 0, 0, 0) 75%);
      mix-blend-mode: screen;
      animation: driftClouds 32s infinite alternate ease-in-out;
    }

    .cloud-1 { width: 900px; height: 600px; top: 10%; left: 5%; animation-duration: 38s; }
    .cloud-2 { width: 1100px; height: 750px; bottom: 5%; right: 0%; animation-duration: 44s; opacity: 0.8; }
    .cloud-3 { width: 700px; height: 500px; top: 40%; left: 45%; animation-duration: 28s; opacity: 0.6; }
    .cloud-4 { width: 850px; height: 650px; bottom: 30%; left: 15%; animation-duration: 34s; opacity: 0.5; }

    @keyframes driftClouds {
      0% {
        transform: translate(0, 0) scale(1) rotate(0deg);
        border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
      }
      50% {
        transform: translate(80px, 60px) scale(1.12) rotate(15deg);
        border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
      }
      100% {
        transform: translate(-60px, -40px) scale(0.92) rotate(-10deg);
        border-radius: 50% 50% 60% 40% / 30% 60% 40% 70%;
      }
    }

    /* Cursor Reactive 3D Liquid Glass Shell */
    .app-card {
      width: 100%;
      max-width: 900px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(0, 0, 0, 0.7) 100%);
      backdrop-filter: blur(50px) saturate(160%);
      -webkit-backdrop-filter: blur(50px) saturate(160%);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      padding: 38px;
      position: relative;
      box-shadow: 
        0 40px 100px -20px rgba(0, 0, 0, 0.95),
        inset 0 1px 1px var(--glass-highlight),
        inset 0 -1px 2px rgba(255, 255, 255, 0.05);
      transform-style: preserve-3d;
      will-change: transform;
      transition: border-color 0.3s;
    }

    /* Dynamic Cursor-Following Specular Sheen (Liquid Glass Light Spot) */
    .app-card::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 28px;
      background: radial-gradient(
        550px circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
        rgba(255, 255, 255, 0.16),
        transparent 65%
      );
      pointer-events: none;
      z-index: 1;
      transition: opacity 0.3s;
    }

    .content-relative {
      position: relative;
      z-index: 2;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .brand-title {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -1.2px;
      background: linear-gradient(135deg, #ffffff 30%, #a1a1aa 70%, #52525b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
      text-shadow: 0 0 25px rgba(255, 255, 255, 0.2);
    }

    .brand-sub {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 3px;
      letter-spacing: 0.2px;
    }

    .credit-tag {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 7px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.4);
      color: var(--text-silver);
    }

    /* Tabs */
    .tab-bar {
      display: flex;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 5px;
      margin-bottom: 20px;
      gap: 6px;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.6);
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 13px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .tab-btn.active {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.03) 100%);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.4);
    }

    /* Sub Tabs (Send / Edit) */
    .sub-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 22px;
    }

    .sub-tab-btn {
      padding: 8px 18px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .sub-tab-btn.active {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.4);
      color: #fff;
      box-shadow: 0 0 16px rgba(255, 255, 255, 0.15);
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 16px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.4px;
      color: var(--text-silver);
      margin-bottom: 7px;
    }

    input[type="text"], input[type="url"], textarea {
      width: 100%;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.03) 0%, rgba(0, 0, 0, 0.6) 100%);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 13px;
      color: #fff;
      outline: none;
      transition: all 0.3s;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
    }

    input:focus, textarea:focus {
      border-color: rgba(255, 255, 255, 0.6);
      background: rgba(255, 255, 255, 0.06);
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.2), inset 0 1px 1px rgba(255, 255, 255, 0.3);
    }

    textarea {
      resize: vertical;
      min-height: 85px;
    }

    /* File / Link Combos */
    .input-combo {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .file-btn {
      padding: 11px 16px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02));
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      position: relative;
      overflow: hidden;
      color: var(--text-silver);
      transition: all 0.25s ease;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.2);
    }

    .file-btn input[type="file"] {
      position: absolute;
      top: 0;
      left: 0;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    .file-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.4);
      color: #fff;
    }

    .file-btn.has-file {
      border-color: #fff;
      color: #fff;
      box-shadow: 0 0 14px rgba(255, 255, 255, 0.3);
    }

    /* Section Separators */
    .section-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #ffffff, #71717a, transparent);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 24px 0 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.18), transparent);
    }

    /* Motion Action Button */
    .action-container {
      margin-top: 28px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .send-btn {
      width: 100%;
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 14px;
      background: linear-gradient(135deg, #27272a 0%, #09090b 50%, #27272a 100%);
      background-size: 200% 200%;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      position: relative;
      user-select: none;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), inset 0 1px 1px rgba(255, 255, 255, 0.4);
      transition: all 0.3s ease;
      animation: btnGradientMove 8s ease infinite;
    }

    @keyframes btnGradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .send-btn:hover {
      background: linear-gradient(135deg, #3f3f46 0%, #18181b 50%, #3f3f46 100%);
      box-shadow: 0 12px 35px rgba(255, 255, 255, 0.15), inset 0 1px 1px #ffffff;
      border-color: rgba(255, 255, 255, 0.6);
      transform: translateY(-1px);
    }

    .send-btn:active {
      transform: scale(0.99);
    }

    .send-btn.firing {
      background: #ffffff !important;
      color: #000000 !important;
      box-shadow: 0 0 45px rgba(255, 255, 255, 0.8) !important;
      animation: firePulse 0.3s infinite alternate;
      border-color: #ffffff;
    }

    @keyframes firePulse {
      0% { transform: scale(0.99); opacity: 0.9; }
      100% { transform: scale(1.01); opacity: 1; }
    }

    .send-hint {
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Monochromatic Terminal */
    .console-panel {
      margin-top: 24px;
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px);
      overflow: hidden;
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.8);
    }

    .console-header {
      padding: 10px 16px;
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-muted);
    }

    .console-body {
      height: 125px;
      overflow-y: auto;
      padding: 12px 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .console-body::-webkit-scrollbar { width: 5px; }
    .console-body::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
    }

    .log-entry { word-break: break-all; }
    .log-info { color: #a1a1aa; }
    .log-success { color: #ffffff; font-weight: 600; text-shadow: 0 0 10px rgba(255, 255, 255, 0.4); }
    .log-error { color: #71717a; text-decoration: underline; }

    /* Footer */
    footer {
      margin-top: 30px;
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
    }

    footer .credit-name {
      color: #ffffff;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    @media (max-width: 650px) {
      .grid-2 { grid-template-columns: 1fr; }
      .app-card { padding: 22px; }
      .brand-title { font-size: 26px; }
    }
  </style>
</head>
<body>

  <!-- Billowy Cloud Motion Gradient Background -->
  <div class="cloud-stage" id="cloudStage">
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>
    <div class="cloud cloud-4"></div>
  </div>

  <!-- Cursor-Reactive 3D Liquid Glass Card -->
  <div class="app-card" id="reactiveCard">
    <div class="content-relative">
      <header>
        <div>
          <div class="brand-title">isaihook</div>
          <p class="brand-sub">Cloud motion liquid glass webhook orchestrator</p>
        </div>
        <div class="credit-tag">by isai_tamil</div>
      </header>

      <!-- Main Tabs -->
      <div class="tab-bar">
        <button class="tab-btn active" id="tab-single-btn" onclick="switchMainTab('single')">Single Webhook</button>
        <button class="tab-btn" id="tab-multi-btn" onclick="switchMainTab('multi')">Multi Webhook</button>
      </div>

      <!-- Single Mode Sub-tabs -->
      <div class="sub-tabs" id="single-sub-tabs">
        <button class="sub-tab-btn active" id="mode-send-btn" onclick="switchMode('send')">Send Message</button>
        <button class="sub-tab-btn" id="mode-edit-btn" onclick="switchMode('edit')">Edit Message</button>
      </div>

      <!-- Target Webhook inputs -->
      <div id="single-target-section">
        <div class="form-group">
          <label>Webhook URL</label>
          <input type="url" id="single-url" placeholder="https://discord.com/api/webhooks/...">
        </div>
        
        <div class="form-group" id="edit-message-group" style="display: none;">
          <label>Message ID or Discord Message URL</label>
          <input type="text" id="target-message-id" placeholder="Paste Discord Message ID or message link to edit">
        </div>
      </div>

      <div id="multi-target-section" style="display: none;">
        <div class="form-group">
          <label>Webhook URLs (One link per line)</label>
          <textarea id="multi-urls" placeholder="https://discord.com/api/webhooks/...&#10;https://discord.com/api/webhooks/..."></textarea>
        </div>
      </div>

      <!-- Webhook Identity -->
      <div class="section-title">Webhook Identity (Override)</div>
      <div class="grid-2">
        <div class="form-group">
          <label>Custom Username</label>
          <input type="text" id="custom-username" placeholder="Override bot display name">
        </div>
        <div class="form-group">
          <label>Custom Avatar (URL or File)</label>
          <div class="input-combo">
            <input type="url" id="custom-avatar-url" placeholder="Direct Avatar Image URL">
            <label class="file-btn" id="file-label-avatar">
              Upload
              <input type="file" id="file-avatar" accept="image/*" onchange="syncFileInput(this, 'file-label-avatar')">
            </label>
          </div>
        </div>
      </div>

      <!-- Text Message -->
      <div class="form-group">
        <label>Message Content</label>
        <textarea id="message-content" placeholder="Content text outside the embed..."></textarea>
      </div>

      <!-- Embed Module -->
      <div class="section-title">Embed Configuration</div>
      
      <div class="grid-2">
        <div class="form-group">
          <label>Embed Title</label>
          <input type="text" id="embed-title" placeholder="Embed Title">
        </div>
        <div class="form-group">
          <label>Embed Accent Color</label>
          <input type="text" id="embed-color" placeholder="#ffffff or 0x000000">
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label>Embed Author Name</label>
          <input type="text" id="embed-author-name" placeholder="Author name">
        </div>
        <div class="form-group">
          <label>Embed Author Avatar</label>
          <div class="input-combo">
            <input type="url" id="embed-author-avatar-url" placeholder="Author Avatar URL">
            <label class="file-btn" id="file-label-author">
              Upload
              <input type="file" id="file-author" accept="image/*" onchange="syncFileInput(this, 'file-label-author')">
            </label>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label>Embed Message (Description)</label>
        <textarea id="embed-description" placeholder="Rich markdown description..."></textarea>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label>Embed Large Image</label>
          <div class="input-combo">
            <input type="url" id="embed-image-url" placeholder="Main Image URL">
            <label class="file-btn" id="file-label-image">
              Upload
              <input type="file" id="file-image" accept="image/*" onchange="syncFileInput(this, 'file-label-image')">
            </label>
          </div>
        </div>
        <div class="form-group">
          <label>Embed Thumbnail Image</label>
          <div class="input-combo">
            <input type="url" id="embed-thumb-url" placeholder="Thumbnail URL">
            <label class="file-btn" id="file-label-thumb">
              Upload
              <input type="file" id="file-thumb" accept="image/*" onchange="syncFileInput(this, 'file-label-thumb')">
            </label>
          </div>
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label>Embed Footer Name</label>
          <input type="text" id="embed-footer-name" placeholder="Footer text">
        </div>
        <div class="form-group">
          <label>Embed Footer Avatar</label>
          <div class="input-combo">
            <input type="url" id="embed-footer-avatar-url" placeholder="Footer icon URL">
            <label class="file-btn" id="file-label-footer">
              Upload
              <input type="file" id="file-footer" accept="image/*" onchange="syncFileInput(this, 'file-label-footer')">
            </label>
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div class="action-container">
        <button class="send-btn" id="main-action-btn">Send Message</button>
        <span class="send-hint">Single Click: Fire once | Long Press & Hold: Continuous auto-dispatch</span>
      </div>

      <!-- Integrated Console -->
      <div class="console-panel">
        <div class="console-header">
          <span>ISAIHOOK TERMINAL</span>
          <span style="cursor: pointer;" onclick="clearLogs()">Clear</span>
        </div>
        <div class="console-body" id="console">
          <div class="log-entry log-info">[isaihook] System initialized. Ready to dispatch.</div>
        </div>
      </div>
    </div>
  </div>

  <footer>
    Crafted by <span class="credit-name">isai_tamil</span>
  </footer>

  <script>
    // State Tracking
    let activeMainTab = 'single';
    let activeMode = 'send';
    let pressTimer = null;
    let loopInterval = null;
    let isFiring = false;

    const mainActionBtn = document.getElementById('main-action-btn');
    const consoleBody = document.getElementById('console');
    const reactiveCard = document.getElementById('reactiveCard');
    const cloudStage = document.getElementById('cloudStage');

    // Cursor-Reactive Smooth 3D Interpolation
    let targetTiltX = 0, targetTiltY = 0;
    let currentTiltX = 0, currentTiltY = 0;

    window.addEventListener('mousemove', (e) => {
      const { innerWidth: w, innerHeight: h } = window;
      targetTiltX = (e.clientX - w / 2) / (w / 2); // -1 to 1
      targetTiltY = (e.clientY - h / 2) / (h / 2); // -1 to 1

      // Track cursor position inside the card for specular reflection spot
      const rect = reactiveCard.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      reactiveCard.style.setProperty('--mouse-x', `${x}px`);
      reactiveCard.style.setProperty('--mouse-y', `${y}px`);
    });

    function renderParallax() {
      // Lerp / smooth damping
      currentTiltX += (targetTiltX - currentTiltX) * 0.08;
      currentTiltY += (targetTiltY - currentTiltY) * 0.08;

      // 3D Card Tilt + Subtle Translation
      reactiveCard.style.transform = `
        rotateX(${-currentTiltY * 6}deg) 
        rotateY(${currentTiltX * 6}deg) 
        translate3d(${currentTiltX * 8}px, ${currentTiltY * 8}px, 0)
      `;

      // Cloud Parallax (moves softly in opposite direction)
      cloudStage.style.transform = `translate(${currentTiltX * -30}px, ${currentTiltY * -30}px)`;

      requestAnimationFrame(renderParallax);
    }
    requestAnimationFrame(renderParallax);

    // Tab Switchers
    function switchMainTab(tab) {
      activeMainTab = tab;
      document.getElementById('tab-single-btn').classList.toggle('active', tab === 'single');
      document.getElementById('tab-multi-btn').classList.toggle('active', tab === 'multi');

      document.getElementById('single-target-section').style.display = tab === 'single' ? 'block' : 'none';
      document.getElementById('single-sub-tabs').style.display = tab === 'single' ? 'flex' : 'none';
      document.getElementById('multi-target-section').style.display = tab === 'multi' ? 'block' : 'none';

      if (tab === 'multi') switchMode('send');
      updateActionButtonText();
    }

    function switchMode(mode) {
      activeMode = mode;
      document.getElementById('mode-send-btn').classList.toggle('active', mode === 'send');
      document.getElementById('mode-edit-btn').classList.toggle('active', mode === 'edit');
      document.getElementById('edit-message-group').style.display = mode === 'edit' ? 'block' : 'none';
      updateActionButtonText();
    }

    function updateActionButtonText() {
      if (activeMode === 'edit') {
        mainActionBtn.innerText = 'Edit Message';
      } else {
        mainActionBtn.innerText = activeMainTab === 'multi' ? 'Dispatch to Multiple Webhooks' : 'Send Message';
      }
    }

    function syncFileInput(input, labelId) {
      const label = document.getElementById(labelId);
      if (input.files && input.files[0]) {
        label.classList.add('has-file');
        label.childNodes[0].nodeValue = input.files[0].name.substring(0, 9) + '..';
      } else {
        label.classList.remove('has-file');
        label.childNodes[0].nodeValue = 'Upload';
      }
    }

    function appendLog(message, type = 'info') {
      const time = new Date().toLocaleTimeString();
      const div = document.createElement('div');
      div.className = `log-entry log-${type}`;
      div.innerText = `[${time}] ${message}`;
      consoleBody.appendChild(div);
      consoleBody.scrollTop = consoleBody.scrollHeight;
    }

    function clearLogs() {
      consoleBody.innerHTML = '';
    }

    function parseMessageId(input) {
      if (!input) return null;
      input = input.trim();
      const match = input.match(/\/(\d+)$/);
      return match ? match[1] : input;
    }

    function parseColor(val) {
      if (!val) return null;
      val = val.trim().replace('#', '').replace('0x', '');
      const parsed = parseInt(val, 16);
      return isNaN(parsed) ? null : parsed;
    }

    function compilePayload() {
      const formData = new FormData();
      let fileCount = 0;

      const content = document.getElementById('message-content').value;
      const username = document.getElementById('custom-username').value;
      const avatarUrl = document.getElementById('custom-avatar-url').value;

      const embedTitle = document.getElementById('embed-title').value;
      const embedColor = parseColor(document.getElementById('embed-color').value);
      const embedDesc = document.getElementById('embed-description').value;

      const authorName = document.getElementById('embed-author-name').value;
      const authorAvatar = document.getElementById('embed-author-avatar-url').value;
      const authorFile = document.getElementById('file-author').files[0];

      const largeImg = document.getElementById('embed-image-url').value;
      const largeFile = document.getElementById('file-image').files[0];

      const thumbImg = document.getElementById('embed-thumb-url').value;
      const thumbFile = document.getElementById('file-thumb').files[0];

      const footerName = document.getElementById('embed-footer-name').value;
      const footerAvatar = document.getElementById('embed-footer-avatar-url').value;
      const footerFile = document.getElementById('file-footer').files[0];

      const payload = {};
      if (content) payload.content = content;
      if (username) payload.username = username;
      if (avatarUrl) payload.avatar_url = avatarUrl;

      const embed = {};
      let hasEmbed = false;

      if (embedTitle) { embed.title = embedTitle; hasEmbed = true; }
      if (embedDesc) { embed.description = embedDesc; hasEmbed = true; }
      if (embedColor !== null) { embed.color = embedColor; hasEmbed = true; }

      // Author handling
      if (authorName) {
        embed.author = { name: authorName };
        if (authorFile) {
          const fn = `author_${fileCount}.png`;
          formData.append(`files[${fileCount}]`, authorFile, fn);
          embed.author.icon_url = `attachment://${fn}`;
          fileCount++;
        } else if (authorAvatar) {
          embed.author.icon_url = authorAvatar;
        }
        hasEmbed = true;
      }

      // Large image handling
      if (largeFile) {
        const fn = `img_${fileCount}.png`;
        formData.append(`files[${fileCount}]`, largeFile, fn);
        embed.image = { url: `attachment://${fn}` };
        fileCount++;
        hasEmbed = true;
      } else if (largeImg) {
        embed.image = { url: largeImg };
        hasEmbed = true;
      }

      // Thumbnail handling
      if (thumbFile) {
        const fn = `thumb_${fileCount}.png`;
        formData.append(`files[${fileCount}]`, thumbFile, fn);
        embed.thumbnail = { url: `attachment://${fn}` };
        fileCount++;
        hasEmbed = true;
      } else if (thumbImg) {
        embed.thumbnail = { url: thumbImg };
        hasEmbed = true;
      }

      // Footer handling
      if (footerName) {
        embed.footer = { text: footerName };
        if (footerFile) {
          const fn = `footer_${fileCount}.png`;
          formData.append(`files[${fileCount}]`, footerFile, fn);
          embed.footer.icon_url = `attachment://${fn}`;
          fileCount++;
        } else if (footerAvatar) {
          embed.footer.icon_url = footerAvatar;
        }
        hasEmbed = true;
      }

      if (hasEmbed) payload.embeds = [embed];

      if (fileCount > 0) {
        formData.append('payload_json', JSON.stringify(payload));
        return { isMultipart: true, data: formData };
      }
      return { isMultipart: false, data: JSON.stringify(payload) };
    }

    async function triggerWebhook() {
      const payloadMeta = compilePayload();

      if (activeMainTab === 'single') {
        const url = document.getElementById('single-url').value.trim();
        if (!url) {
          appendLog('Provide a valid Webhook URL', 'error');
          return;
        }

        if (activeMode === 'edit') {
          const rawId = document.getElementById('target-message-id').value;
          const messageId = parseMessageId(rawId);
          if (!messageId) {
            appendLog('Message ID or Link required for editing', 'error');
            return;
          }
          await executeRequest(`${url.replace(/\/$/, '')}/messages/${messageId}`, 'PATCH', payloadMeta);
        } else {
          await executeRequest(url, 'POST', payloadMeta);
        }

      } else {
        const rawUrls = document.getElementById('multi-urls').value.split('\n');
        const urls = rawUrls.map(u => u.trim()).filter(u => u.startsWith('http'));

        if (urls.length === 0) {
          appendLog('No valid Webhook URLs in Multi list', 'error');
          return;
        }

        for (const url of urls) {
          await executeRequest(url, 'POST', payloadMeta);
        }
      }
    }

    async function executeRequest(url, method, payloadMeta) {
      try {
        const reqConfig = { method: method };
        if (payloadMeta.isMultipart) {
          reqConfig.body = payloadMeta.data;
        } else {
          reqConfig.headers = { 'Content-Type': 'application/json' };
          reqConfig.body = payloadMeta.data;
        }

        const res = await fetch(url, reqConfig);
        if (res.ok || res.status === 204) {
          appendLog(`${method} Success: HTTP ${res.status}`, 'success');
        } else if (res.status === 429) {
          const body = await res.json().catch(() => ({ retry_after: 1 }));
          appendLog(`Rate limited! Wait ${body.retry_after}s`, 'error');
        } else {
          const bodyErr = await res.text();
          appendLog(`Failed: HTTP ${res.status} - ${bodyErr.substring(0, 90)}`, 'error');
        }
      } catch (err) {
        appendLog(`Network Exception: ${err.message}`, 'error');
      }
    }

    // Long Press Handler
    function engageFiring() {
      isFiring = false;
      pressTimer = setTimeout(() => {
        isFiring = true;
        mainActionBtn.classList.add('firing');
        mainActionBtn.innerText = 'FIRING CONTINUOUSLY...';
        appendLog('Continuous dispatch loop activated.', 'info');
        triggerWebhook();
        loopInterval = setInterval(triggerWebhook, 600);
      }, 500);
    }

    function disengageFiring() {
      clearTimeout(pressTimer);
      if (isFiring) {
        clearInterval(loopInterval);
        isFiring = false;
        mainActionBtn.classList.remove('firing');
        updateActionButtonText();
        appendLog('Continuous dispatch disengaged.', 'info');
      }
    }

    mainActionBtn.addEventListener('mousedown', engageFiring);
    window.addEventListener('mouseup', disengageFiring);

    mainActionBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      engageFiring();
    });
    window.addEventListener('touchend', disengageFiring);

    mainActionBtn.addEventListener('click', () => {
      if (!isFiring) triggerWebhook();
    });
  </script>
</body>
</html>
